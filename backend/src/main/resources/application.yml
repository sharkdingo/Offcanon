spring:
  application:
    name: pico
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
server:
  port: 8080
  shutdown: graceful
pico:
  data-root: ${PICO_DATA_ROOT:${user.home}/.pico}
  agent:
    max-steps: ${PICO_AGENT_MAX_STEPS:20}
    model-max-attempts: ${PICO_MODEL_MAX_ATTEMPTS:3}
    run-timeout-seconds: ${PICO_AGENT_RUN_TIMEOUT_SECONDS:600}
    context-limit-chars: ${PICO_AGENT_CONTEXT_LIMIT_CHARS:80000}
    command-timeout-seconds: ${PICO_COMMAND_TIMEOUT_SECONDS:30}
    observation-limit: ${PICO_OBSERVATION_LIMIT:12000}
  model:
    request-timeout-seconds: ${PICO_MODEL_REQUEST_TIMEOUT_SECONDS:120}
  events:
    in-memory-retention: ${PICO_EVENT_RETENTION:2000}
    poll-interval-ms: ${PICO_EVENT_POLL_INTERVAL_MS:500}
