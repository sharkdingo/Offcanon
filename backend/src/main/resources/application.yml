spring:
  application:
    name: offcanon
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
server:
  port: 8080
  shutdown: graceful
offcanon:
  data-root: ${OFFCANON_DATA_ROOT:${user.home}/.offcanon}
  agent:
    max-steps: ${OFFCANON_AGENT_MAX_STEPS:20}
    model-max-attempts: ${OFFCANON_MODEL_MAX_ATTEMPTS:3}
    run-timeout-seconds: ${OFFCANON_AGENT_RUN_TIMEOUT_SECONDS:600}
    context-limit-chars: ${OFFCANON_AGENT_CONTEXT_LIMIT_CHARS:80000}
    command-timeout-seconds: ${OFFCANON_COMMAND_TIMEOUT_SECONDS:30}
    observation-limit: ${OFFCANON_OBSERVATION_LIMIT:12000}
  model:
    request-timeout-seconds: ${OFFCANON_MODEL_REQUEST_TIMEOUT_SECONDS:120}
  events:
    in-memory-retention: ${OFFCANON_EVENT_RETENTION:2000}
    poll-interval-ms: ${OFFCANON_EVENT_POLL_INTERVAL_MS:500}
    heartbeat-interval-ms: ${OFFCANON_EVENT_HEARTBEAT_INTERVAL_MS:15000}
