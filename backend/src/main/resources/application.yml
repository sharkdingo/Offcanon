spring:
  application:
    name: offcanon
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
  # Offcanon is a local desktop service. Keep the HTTP surface off the LAN by
  # default; deployments that intentionally expose it must opt in explicitly.
  address: 127.0.0.1
  shutdown: graceful
offcanon:
  data-root: ${user.home}/.offcanon
  agent:
    max-steps: 20
    max-steps-ceiling: 100
    model-max-attempts: 4
    run-timeout-seconds: 600
    run-timeout-seconds-ceiling: 86400
    context-limit-chars: 80000
    context-limit-chars-ceiling: 1000000
    recovery-interval-ms: 30000
    command-timeout-seconds: 30
    observation-limit: 12000
  model:
    request-timeout-seconds: 120
  runtime:
    retention-interval-ms: 3600000
    orphan-retention-hours: 24
    verification-retention-hours: 24
    promotion-retention-hours: 24
    snapshot-retention-hours: 168
  events:
    poll-interval-ms: 500
    heartbeat-interval-ms: 15000
